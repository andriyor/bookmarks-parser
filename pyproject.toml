[project]
name = "bookmarks-parser"
version = "0.1.3"
description = "netscape bookmarks parser"
authors = [{ name = "Andriy Orehov", email = "andriyorehov@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.5.0",
    "html5lib>=1.0",
]

[project.urls]
Homepage = "https://github.com/andriyor/bookmarks-parser"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
